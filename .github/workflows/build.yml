name: Build debug APK

# Runs automatically on every push, and can also be triggered manually
# from the Actions tab ("Run workflow" button).
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"
          cache-disabled: true

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-build-cache --no-configuration-cache

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OurLauncher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
